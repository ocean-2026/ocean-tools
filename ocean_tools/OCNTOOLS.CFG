# Ocean's Tools configuration - read on every startup.
# Edit and restart ocntools to apply. '#' starts a comment.
TITLE=OCEAN'S TOOLS
TAGLINE=a better command line for CatOS - userland CE app (v1.6)
WELCOME=Welcome to Ocean's Tools. A better CatOS command line.
INFO_BOOT=Boot time  : 
INFO_FS=Filesystem : 
INFO_NET=Network    : 
HINT=Type 'help', or just a file name to open it.
PROMPT=ocean
COLOR_TITLE=9
COLOR_TAGLINE=14
COLOR_PROMPT=11
# Startup commands run in order after the banner.
# 'echo [0-15] TEXT' prints with any of the 16 VGA colors.
STARTUP_CMD=echo 11 Ocean's Tools is ready.
STARTUP_CMD=echo 9  a better command line for CatOS
STARTUP_CMD=echo 14 type 'help', or just a file name to open it.
